name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  # Gating: stylua + luacheck must pass.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: stylua (check)
        uses: JohnnyMorganz/stylua-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Pinned, not "latest": stylua's formatting rules shift between
          # releases and silently turn CI red on every push. Bump deliberately.
          version: v2.5.2
          args: --check lua plugin TESTS

      - name: Install luacheck
        run: sudo apt-get update && sudo apt-get install -y luarocks && sudo luarocks install luacheck 1.2.0

      - name: luacheck
        run: luacheck lua plugin TESTS

  # Real gate: the framework-free headless suite. lib.nvim is checked out as a
  # sibling and put on the runtimepath — open.nvim depends on it hard
  # (notify, usercmd.composer, cross.platform, cross.fs.wslpath, cross.run).
  # ui.nvim is checked out the same way — the picker test drives
  # open.picker's require("ui.kit").select() for real.
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{{{ matrix.os }}}}
    strategy:
      # One platform failing must not cancel the others: which of the three
      # broke is the whole information content of this job.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        # Windows runners default to PowerShell; one shell on all three keeps
        # the run step itself from being what differs between platforms.
        shell: bash
    steps:
      - name: Checkout open.nvim
        uses: actions/checkout@v5
        with:
          path: open.nvim

      - name: Checkout lib.nvim
        uses: actions/checkout@v5
        with:
          repository: StefanBartl/lib.nvim
          path: lib.nvim
          ref: ci-verified

      - name: Checkout ui.nvim
        uses: actions/checkout@v5
        with:
          repository: StefanBartl/ui.nvim
          path: ui.nvim

      - name: Install Neovim (stable)
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable

      - name: Run tests
        working-directory: open.nvim
        env:
          REPOS_DIR: ${{ github.workspace }}
        run: nvim --headless -u NONE -c "set rtp+=." -c "set rtp+=../lib.nvim" -c "set rtp+=../ui.nvim" -c "luafile TESTS/run.lua" -c "qa!"
